name: Docker Image CI/CD

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Create env file
        run: echo "${{ secrets.TWITTER_ENV_PRODUCTION }}" > .env.production

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: trunganh312/twitter:v2
          cache-from: type=registry,ref=trunganh312/twitter:v2
          cache-to: type=inline

      - name: Deploy to VPS
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
            docker pull trunganh312/twitter:v2
            docker stop twitter-clone || true
            docker rm twitter-clone || true
            docker run -d -p 3000:3000 --name twitter-clone -v ~/twitter-api/uploads:/app/uploads --restart unless-stopped trunganh312/twitter:v2
