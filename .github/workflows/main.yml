name: Notify Telegram

on:
  push:
    branches: ['master']
  pull_request:
    types: [opened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Message
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ $GITHUB_EVENT_NAME == "push" ]]; then
            curl -s -X POST https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage \
              -d chat_id=${TELEGRAM_CHAT_ID} \
              -d parse_mode="Markdown" \
              -d text="🚀 *Push Event Detected!*\n\n*Repo:* ${{ github.repository }}\n*Pusher:* ${{ github.actor }}\n*Branch:* ${{ github.ref_name }}\n[View Commit](${{ github.event.head_commit.url }})"
          elif [[ $GITHUB_EVENT_NAME == "pull_request" ]]; then
            curl -s -X POST https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage \
              -d chat_id=${TELEGRAM_CHAT_ID} \
              -d parse_mode="Markdown" \
              -d text="🔄 *Pull Request Event!*\n\n*Repo:* ${{ github.repository }}\n*Action:* ${{ github.event.action }}\n*PR Title:* ${{ github.event.pull_request.title }}\n[View PR](${{ github.event.pull_request.html_url }})"
